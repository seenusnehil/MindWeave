<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindWeave</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="small-logo">
            MindWeave
        </div>
    </header>

    <div class="canvas-container">
        <canvas id="graph-canvas"></canvas>
    </div>
    
    <div class="brain-container">
        <svg class="brain-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Pulse circles -->
            <circle cx="230" cy="140" r="10" fill="rgba(255, 255, 255, 0.2)">
                <animate attributeName="r" values="5;15;5" dur="4s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="282" cy="140" r="10" fill="rgba(255, 255, 255, 0.2)">
                <animate attributeName="r" values="5;15;5" dur="4s" begin="1s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="222" cy="224" r="10" fill="rgba(255, 255, 255, 0.2)">
                <animate attributeName="r" values="5;15;5" dur="4s" begin="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="290" cy="224" r="10" fill="rgba(255, 255, 255, 0.2)">
                <animate attributeName="r" values="5;15;5" dur="4s" begin="3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="3s" repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>
    
    <div class="main-container">
        <div class="main-logo">
            <h1 class="title">MindWeave</h1>
            <p class="tagline">Amplify your thinking. Connect your knowledge.</p>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>

    <script src="script.js"></script>
</body>
</html>
